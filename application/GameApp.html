<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des fichiers JSON</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="game-controls">
        <div class="game-info">
          <div class="game-details">
            <div class="score-details">
              <div class="score-inputs">
                <div class="active-inning-info" id="active-inning-info">
                  <span id="active-inning-label">Manche active: N/A</span>
                  <span id="active-out-label">Out (R): 0</span>
                  <span class="points-limit-control">
                    <label for="innings-count-input"
                      >Nombre de manches à jouer:</label
                    >
                    <input
                      type="number"
                      id="innings-count-input"
                      min="1"
                      value="9"
                      onchange="updateInningsCount()"
                    />
                  </span>
                  <span class="points-limit-control">
                    <label for="points-limit-input"
                      >Limite de points par manche:</label
                    >
                    <input
                      type="number"
                      id="points-limit-input"
                      min="1"
                      value="4"
                      onchange="updatePointsLimit()"
                    />
                  </span>
                </div>
              </div>
              <div class="score-table-wrapper">
                <div class="time-details">
                  <div class="date-selection">
                    <label for="game-date">Date du match:</label>
                    <input type="date" id="game-date" onchange="saveGameState()" />
                  </div>
                  <div class="time-selection">
                    <label for="game-time">Heure du match:</label>
                    <select id="game-time-select" onchange="saveGameState()">
                      <option value="19h00">19h00</option>
                      <option value="20h30">20h30</option>
                    </select>
                    <input
                      type="time"
                      id="game-time-input"
                      style="display: none"
                      onchange="saveGameState()"
                    />
                  </div>
                </div>
                <table class="score-table" id="score-table">
                  <thead>
                    <tr id="score-header-row">
                      <th></th>
                      <th>Équipe</th>
                      <th id="err-total">Err</th>
                      <th>CC</th>
                      <th>Total</th>
                      <th>Coureurs</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr id="away-score-row">
                      <td><label>Visiteur</label></td>
                      <td>
                        <select
                          id="team-select-visiteur"
                          onchange="loadTeamPlayers()"
                        ></select>
                        <input
                          type="text"
                          id="team-name-input-visiteur"
                          class="team-name-input"
                          placeholder="Nom de l'équipe visiteuse"
                          style="display: none"
                          oninput="updateCustomTeamName('away', this.value)"
                        />
                      </td>
                      <td id="away-err-total">0</td>
                      <td id="away-cc-total">0</td>
                      <td id="away-total">0</td>
                      <td>
                        <div class="runner-count-cell">
                          <button type="button" onclick="decrementRunnerCount('away')">-</button>
                          <span id="away-runner-count">0</span>
                          <button type="button" onclick="incrementRunnerCount('away')">+</button>
                        </div>
                      </td>
                    </tr>
                    <tr id="home-score-row">
                      <td><label>Local</label></td>
                      <td>
                        <select
                          id="team-select"
                          onchange="loadTeamPlayers()"
                        ></select>
                        <input
                          type="text"
                          id="team-name-input"
                          class="team-name-input"
                          placeholder="Nom de l'équipe locale"
                          style="display: none"
                          oninput="updateCustomTeamName('home', this.value)"
                        />
                      </td>
                      <td id="home-err-total">0</td>
                      <td id="home-cc-total">0</td>
                      <td id="home-total">0</td>
                      <td>
                        <div class="runner-count-cell">
                          <button type="button" onclick="decrementRunnerCount('home')">-</button>
                          <span id="home-runner-count">0</span>
                          <button type="button" onclick="incrementRunnerCount('home')">+</button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="top-actions">
               <div class="game-start-control">
                <button
                  type="button"
                  id="start-game-button"
                  onclick="startGame()"
                >
                  Démarrer la partie
                </button>
                <span id="game-status-label" class="game-status-label"></span>
              </div>
              <div class="memory-games-selection">
                <div>
                  <label for="memory-games-select">Parties en mémoire :</label>
                  <select id="memory-games-select"></select>
                </div>
                <div>
                  <button
                    type="button"
                    id="memory-games-load-button"
                    onclick="loadSelectedMemoryGame(false)"
                  >
                    Reprendre
                  </button>
                  <button
                    type="button"
                    id="memory-games-load-lineup-button"
                    onclick="loadSelectedMemoryGame(true)"
                  >
                    Charger seulement le lineup
                  </button>
                  <button
                    type="button"
                    id="memory-games-delete-button"
                    onclick="deleteSelectedMemoryGame()"
                  >
                    Oublier
                  </button>
                </div>
              </div>
              <div>
                <label for="free-mode-toggle" class="toggle-label">
                  <input
                    type="checkbox"
                    id="free-mode-toggle"
                    onchange="toggleFreeMode()"
                  />
                  Mode libre
                </label>
              </div>
              <div class="file-actions">
                <button id="save-top-button" onclick="saveJson()">
                  Générer et sauvegarder (Fichier)
                </button>
                <button id="load-top-button" onclick="loadGameJson()">
                  Charger une partie (Fichier)
                </button>
                <button id="reset-top-button" onclick="resetGameState()">
                  Réinitialiser
                </button>
              </div>
            </div>
          </div>
          <div class="tabs">
            <button
              class="tab-button active"
              id="tab-button-away"
              onclick="switchTab('away')"
            >
              Visiteur
            </button>
            <button
              class="tab-button"
              id="tab-button-home"
              onclick="switchTab('home')"
            >
              Local
            </button>
          </div>
        </div>

        <div id="lineup-container" class="lineup"></div></div>
      </div>
    </div>

    <pre id="output"></pre>
    <script src="gameApp.js"></script>
  </body>
</html>
